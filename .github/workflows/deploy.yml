name: Deploy

# Despliegue manual por entorno (R-CD-9..13).
#   dev   → build local (base + overlay dev)
#   stage → consume las imágenes promovidas en GHCR (:stage)
#   prod  → consume las imágenes promovidas en GHCR (:prod)
# Tras el `up` se ejecuta el smoke del entorno (R-CD-12): en dev y stage (stack
# efímero del runner, con las imágenes `:stage` ya promovidas) corre el flujo
# E2E completo `npm run demo`; en prod, un smoke remoto de solo lectura que
# exige SMOKE_ADMIN_EMAIL/SMOKE_ADMIN_PASSWORD del environment.
# Si existen SMOKE_EMPRESARIO_EMAIL/SMOKE_EMPRESARIO_PASSWORD, el smoke valida
# además `/api/v2/empresarios/me/ventas` (commissions-service en stage, ADR-37).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a desplegar'
        required: true
        default: stage
        type: choice
        options:
          - dev
          - stage
          - prod
      source:
        description: 'Tag a fijar por digest (vacío = stage/prod del entorno)'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-${{ github.event.inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.event.inputs.environment }}
    env:
      TZ: America/Managua
    # `packages: read` para tirar de las imágenes privadas publicadas en GHCR (R-CD-3).
    permissions:
      contents: read
      packages: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Resolve compose files and gateway port
        id: cfg
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)   echo "files=-f docker-compose.dev.yml" >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT"; echo "build=--build" >> "$GITHUB_OUTPUT"; echo "digest=" >> "$GITHUB_OUTPUT" ;;
            stage) echo "files=-f docker-compose.stage.yml" >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT"; echo "build=" >> "$GITHUB_OUTPUT"; echo "digest=-f docker-compose.digest.yml" >> "$GITHUB_OUTPUT" ;;
            prod)  echo "files=-f docker-compose.yml"  >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT"; echo "build=" >> "$GITHUB_OUTPUT"; echo "digest=-f docker-compose.digest.yml" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 🔒 Fijar imágenes por digest (R-CD-3)
        if: github.event.inputs.environment != 'dev'
        env:
          SOURCE: ${{ github.event.inputs.source }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          TAG="${SOURCE:-$ENVIRONMENT}"
          node scripts/tools/render-compose-digest.mjs \
            --source "$TAG" --environment "$ENVIRONMENT" --output docker-compose.digest.yml

      - name: 🧰 Prepare environment file
        # Dev y stage levantan un stack efímero en el runner: si no hay `.env`
        # (p. ej. runner hosted), se parte de la plantilla. Prod conserva el
        # archivo del entorno real.
        if: github.event.inputs.environment != 'prod'
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: 🚀 Bring the stack up
        env:
          FILES: ${{ steps.cfg.outputs.files }}
          DIGEST: ${{ steps.cfg.outputs.digest }}
          BUILD: ${{ steps.cfg.outputs.build }}
        run: |
          # En dev se construye; en stage/prod se consumen las imágenes de GHCR
          # fijadas por digest (R-CD-3), sin `build`.
          docker compose $FILES $DIGEST up -d $BUILD

      - name: ⏳ Wait for gateway readiness (R-CD-12)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${{ steps.cfg.outputs.port }}/health" >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "unhealthy"
          docker compose ${{ steps.cfg.outputs.files }} logs
          exit 1

      - name: 🧪 Smoke E2E del stack (R-CD-12)
        if: github.event.inputs.environment != 'prod'
        env:
          BASE_URL: http://localhost:${{ steps.cfg.outputs.port }}
        run: npm run demo

      - name: 🧾 Verificar logs sin errores inesperados (R-E-8)
        if: github.event.inputs.environment != 'prod' && success()
        run: |
          logs="$(docker compose ${{ steps.cfg.outputs.files }} logs --no-color)"
          if printf '%s\n' "$logs" | grep -E '"nivel":"error"|UnhandledPromiseRejection|uncaughtException'; then
            echo "Unexpected service error detected during dev smoke."
            exit 1
          fi

      - name: 🧪 Smoke remoto de solo lectura (R-CD-12)
        if: github.event.inputs.environment == 'prod'
        env:
          BASE_URL: http://localhost:${{ steps.cfg.outputs.port }}
          ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          EMPRESARIO_EMAIL: ${{ secrets.SMOKE_EMPRESARIO_EMAIL }}
          EMPRESARIO_PASSWORD: ${{ secrets.SMOKE_EMPRESARIO_PASSWORD }}
        run: npm run smoke:remote

      - name: 📊 Evidence
        if: always()
        run: docker compose ${{ steps.cfg.outputs.files }} ps

      - name: 🧹 Teardown
        if: always()
        run: docker compose ${{ steps.cfg.outputs.files }} down -v --remove-orphans || true
