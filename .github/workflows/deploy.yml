name: Deploy

# Despliegue manual por entorno (R-CD-9..13).
#   dev   → build local (base + overlay dev)
#   stage → consume las imágenes promovidas en GHCR (:stage)
#   prod  → consume las imágenes promovidas en GHCR (:prod)
# Tras el `up` se ejecuta el smoke del entorno (R-CD-12): `GET /health`, login y
# una lectura real del catálogo en stage/prod; en dev, el flujo E2E completo
# (`npm run demo`). Stage/prod requieren SMOKE_ADMIN_EMAIL/SMOKE_ADMIN_PASSWORD.
# Si existen SMOKE_EMPRESARIO_EMAIL/SMOKE_EMPRESARIO_PASSWORD, el smoke valida
# además `/api/v1/empresarios/me/ventas` (commissions-service en stage, ADR-37).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a desplegar'
        required: true
        default: stage
        type: choice
        options:
          - dev
          - stage
          - prod

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-${{ github.event.inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.event.inputs.environment }}
    env:
      TZ: America/Managua
    # `packages: read` para tirar de las imágenes privadas publicadas en GHCR (R-CD-3).
    permissions:
      contents: read
      packages: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Resolve compose files and gateway port
        id: cfg
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)   echo "files=-f docker-compose.dev.yml" >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT"; echo "build=--build" >> "$GITHUB_OUTPUT" ;;
            stage) echo "files=-f docker-compose.stage.yml" >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT"; echo "build=" >> "$GITHUB_OUTPUT" ;;
            prod)  echo "files=-f docker-compose.yml"  >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT"; echo "build=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 🧰 Prepare development environment
        if: github.event.inputs.environment == 'dev'
        run: cp .env.example .env

      - name: 🚀 Bring the stack up
        env:
          FILES: ${{ steps.cfg.outputs.files }}
          BUILD: ${{ steps.cfg.outputs.build }}
        run: |
          # En dev se construye; en stage/prod se consumen las imágenes de GHCR
          # promovidas por `promote.yml` (R-CD-3), sin `build`.
          docker compose $FILES up -d $BUILD

      - name: ⏳ Wait for gateway readiness (R-CD-12)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${{ steps.cfg.outputs.port }}/health" >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "unhealthy"
          docker compose ${{ steps.cfg.outputs.files }} logs
          exit 1

      - name: 🧪 Smoke E2E de desarrollo (R-CD-12)
        if: github.event.inputs.environment == 'dev'
        env:
          BASE_URL: http://localhost:${{ steps.cfg.outputs.port }}
        run: npm run demo

      - name: 🧾 Verificar logs sin errores inesperados (R-E-8)
        if: github.event.inputs.environment == 'dev' && success()
        run: |
          logs="$(docker compose ${{ steps.cfg.outputs.files }} logs --no-color)"
          if printf '%s\n' "$logs" | grep -E '"nivel":"error"|UnhandledPromiseRejection|uncaughtException'; then
            echo "Unexpected service error detected during dev smoke."
            exit 1
          fi

      - name: 🧪 Smoke remoto de solo lectura (R-CD-12)
        if: github.event.inputs.environment != 'dev'
        env:
          BASE_URL: http://localhost:${{ steps.cfg.outputs.port }}
          ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          EMPRESARIO_EMAIL: ${{ secrets.SMOKE_EMPRESARIO_EMAIL }}
          EMPRESARIO_PASSWORD: ${{ secrets.SMOKE_EMPRESARIO_PASSWORD }}
          EDGE_BASIC_AUTH: ${{ secrets.EDGE_BASIC_AUTH }}
        run: npm run smoke:remote

      - name: 📈 k6 load gate (R-CD-12)
        if: github.event.inputs.environment != 'dev'
        env:
          BASE_URL: http://localhost:${{ steps.cfg.outputs.port }}
          ENV: ${{ github.event.inputs.environment }}
          K6_EMPRESA_ID: ${{ secrets.K6_EMPRESA_ID }}
          K6_STORE_SLUG: ${{ secrets.K6_STORE_SLUG }}
          K6_BUYER_EMAIL: ${{ secrets.K6_BUYER_EMAIL }}
          K6_BUYER_PASSWORD: ${{ secrets.K6_BUYER_PASSWORD }}
          K6_INTERNAL_KEY: ${{ secrets.K6_INTERNAL_KEY }}
          K6_EDGE_BASIC_AUTH: ${{ secrets.EDGE_BASIC_AUTH }}
          K6_READY: ${{ vars.K6_READY }}
          K6_LOAD_RATE: ${{ github.event.inputs.environment == 'stage' && vars.K6_RATE_STAGE || vars.K6_RATE_PROD }}
          K6_LOAD_DURATION: ${{ vars.K6_DURATION || '60s' }}
          K6_SUMMARY: /scripts/k6-summary.json
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/tests/k6:/scripts" \
            -e BASE_URL -e K6_EMPRESA_ID -e K6_STORE_SLUG -e K6_BUYER_EMAIL -e K6_BUYER_PASSWORD \
            -e K6_INTERNAL_KEY -e K6_EDGE_BASIC_AUTH -e K6_READY -e K6_LOAD_RATE -e K6_LOAD_DURATION -e K6_SUMMARY \
            grafana/k6:latest run --quiet /scripts/load.js
          node tests/k6/tools/k6-compare.mjs --summary tests/k6/k6-summary.json \
            --env "$ENV" --scenario load --allow-missing

      - name: 📊 Evidence
        if: always()
        run: docker compose ${{ steps.cfg.outputs.files }} ps

      - name: 🧹 Teardown
        if: always()
        run: docker compose ${{ steps.cfg.outputs.files }} down -v --remove-orphans || true
