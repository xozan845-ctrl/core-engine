name: Promote

# Promoción de las imágenes **ya publicadas** de un tag entre entornos, sin
# reconstruir (R-CD-3, R-CD-6). Se promueve **por digest** (@sha256:): se
# resuelve el digest del tag de origen y se reetiqueta a `:stage`/`:prod`,
# conservándolo. `environment` habilita el gate/revisores por entorno (R-CD-6).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno destino'
        required: true
        type: choice
        options:
          - stage
          - prod
      source:
        description: 'Tag de release publicado en GHCR a promover (p. ej. v1.2.3)'
        required: true
      dry_run:
        description: 'Simular la promoción sin publicar (R-CD-8)'
        type: boolean
        default: true

concurrency:
  group: promote-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: promote-${{ github.event.inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `environment` habilita el gate de producción si el repo lo configura (R-CD-6).
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚚 Promote images by digest (pull + retag + push, R-CD-3)
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          SERVICES="api-gateway identity-service catalog-service stores-service orders-service logistics-service commissions-service finance-service field-service market-intelligence-service"
          {
            echo "### Promoción → ${INPUT_ENV}"
            echo "- origen: \`${INPUT_SOURCE}\`"
            echo "- dry_run: \`${INPUT_DRY_RUN}\`"
            echo ""
            echo "| servicio | digest | destino |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for svc in $SERVICES; do
            SRC="ghcr.io/${OWNER}/core-engine-${svc}:${INPUT_SOURCE}"
            TARGET="ghcr.io/${OWNER}/core-engine-${svc}:${INPUT_ENV}"
            echo "→ ${svc}: ${SRC} → ${TARGET}"
            docker pull "$SRC"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$SRC")
            # Promoción literal por digest: se reetiqueta el manifiesto inmutable.
            docker pull "$DIGEST"
            docker tag "$DIGEST" "$TARGET"
            if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
              echo "dry_run: no se publica ${TARGET}"
            else
              docker push "$TARGET"
            fi
            echo "| ${svc} | \`${DIGEST}\` | \`:${INPUT_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
