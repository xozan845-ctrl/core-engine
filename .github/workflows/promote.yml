name: Promote

# Promoción de las imágenes **ya publicadas** de un tag entre entornos, sin
# reconstruir (R-CD-3, R-CD-6). Se promueve **por digest** (@sha256:): se
# resuelve el digest del índice publicado por `release.yml` y se **copia** con
# `buildx imagetools create`, que preserva el manifiesto (plataformas y
# atestaciones incluidas). Un `docker pull`+`tag`+`push` NO sirve: el image
# store clásico degrada el índice a un manifiesto de una sola plataforma y el
# digest cambia. Tras cada copia se **verifica** que el digest destino es
# idéntico al de origen; si no, el run falla. `environment` habilita el
# gate/revisores por entorno (R-CD-6).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno destino'
        required: true
        type: choice
        options:
          - stage
          - prod
      source:
        description: 'Tag de release publicado en GHCR a promover (p. ej. v1.2.3)'
        required: true
      dry_run:
        description: 'Simular la promoción sin publicar (R-CD-8)'
        type: boolean
        default: true

concurrency:
  group: promote-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: promote-${{ github.event.inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `environment` habilita el gate de producción si el repo lo configura (R-CD-6).
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🚚 Promote images by digest (copy, R-CD-3)
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          SERVICES="api-gateway identity-service catalog-service stores-service orders-service logistics-service commissions-service finance-service field-service market-intelligence-service"
          {
            echo "### Promoción → ${INPUT_ENV}"
            echo "- origen: \`${INPUT_SOURCE}\`"
            echo "- dry_run: \`${INPUT_DRY_RUN}\`"
            echo ""
            echo "| servicio | digest | destino |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for svc in $SERVICES; do
            NAME="ghcr.io/${OWNER}/core-engine-${svc}"
            SRC="${NAME}:${INPUT_SOURCE}"
            TARGET="${NAME}:${INPUT_ENV}"
            SRC_DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')
            echo "→ ${svc}: ${SRC}@${SRC_DIGEST} → ${TARGET}"
            if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
              echo "dry_run: no se publica ${TARGET}"
            else
              # Copia registro-a-registro por digest: no se reconstruye ni se
              # reempaqueta, así que el artefacto no cambia (R-CD-3).
              docker buildx imagetools create -t "$TARGET" "${NAME}@${SRC_DIGEST}"
              DST_DIGEST=$(docker buildx imagetools inspect "$TARGET" --format '{{.Manifest.Digest}}')
              if [[ "${SRC_DIGEST}" != "${DST_DIGEST}" ]]; then
                echo "ERROR: ${svc} cambió de digest al promover (${SRC_DIGEST} != ${DST_DIGEST}); promover es copiar, no reconstruir (R-CD-3)."
                exit 1
              fi
            fi
            echo "| ${svc} | \`${SRC_DIGEST}\` | \`:${INPUT_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
