name: Stage Images

# Construye las imágenes `:stage` desde la rama `staging` (R-CD-3/R-CD-12).
# Las imágenes de producción siguen saliendo de `release.yml` + `promote.yml`;
# las de stage se construyen aquí para que el entorno de aceptación pueda
# desplegar el mismo contenido que la rama `staging`, incluidos servicios
# nuevos como `inventory-service`.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: stage-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: stage image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - catalog-service
          - inventory-service
          - stores-service
          - orders-service
          - logistics-service
          - scheduling-service
          - commissions-service
          - finance-service
          - field-service
          - market-intelligence-service
          - storage-service
          - notifications-service
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Resolve tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/core-engine-${SERVICE}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:stage"
            echo "${IMAGE}:stage-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build and push stage image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          labels: |
            org.opencontainers.image.title=core-engine-${{ matrix.service }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=stage-${GITHUB_SHA:0:7}
          cache-from: type=gha,scope=stage-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=stage-${{ matrix.service }}

      - name: 🧾 Evidence
        run: |
          {
            echo "### ${{ matrix.service }} (:stage)"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- tags: \`:stage\`, \`:stage-${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
