name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

# R-CI-2: un push nuevo cancela el run anterior de la misma rama/PR;
# prohibido apilar runs obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Security Gate (npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Security audit (Regla R-QA-6 — docs/rules/test/07-qa-gates.md)
        run: npm audit --audit-level=high

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint TypeScript sources (Gate G-7 — docs/rules/test/06-estandares-cobertura.md)
        run: npm run lint

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build shared library
        run: npm run build -w @core/shared
      - name: Run tests with coverage
        run: npm test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: packages/*/coverage/
          retention-days: 7

  build:
    name: Build all services
    runs-on: ubuntu-24.04
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build all packages
        run: npm run build
      - name: Gate G-8 — spec OpenAPI sincronizado (R-DO-6, R-C-7)
        run: npm run swagger:export && git diff --exit-code docs/openapi packages/api-gateway/src/openapi.agregado.ts
