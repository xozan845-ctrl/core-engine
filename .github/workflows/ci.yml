name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    # Enmienda R-CI-1 (2026-10-22): los PRs apilados con base feat/** también
    # ejecutan CI, para que cada PR tenga checks verdes en su cabeza (R-PR-6).
    branches: [main, develop, staging, 'feat/**']
  workflow_dispatch:

# R-CI-2: un push nuevo cancela el run anterior de la misma rama/PR;
# prohibido apilar runs obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-check:
    name: Rules (docs/rules + commits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Test governance engine against false greens
        run: npm run test:engine
      - name: Test smoke runner against false greens and network stalls
        run: npm run test:smoke
      - name: Guard baselines against new debt or exceptions
        run: npm run baseline:guard -- --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - name: Validate project rules (R-CI-7, R-GC-1..4)
        run: node scripts/cli.mjs rules
      - name: Architecture catalog and baseline in sync (R-AF-2/R-AF-4)
        run: npm run architecture:check

  security-gate:
    name: Security Gate (npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Secret scan (R-DS-1 — docs/rules/data/02-seguridad.md)
        run: npm run security:secrets
      - name: Security audit (Regla R-QA-6 — docs/rules/test/07-qa-gates.md)
        run: npm audit --audit-level=high

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint de scripts de gobernanza (Gate G-7 — docs/rules/test/06-estandares-cobertura.md)
        run: npm run lint

  integration-catalog:
    name: API + BD contracts (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
      TZ: America/Managua
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Verify catalog stock projection and API contracts against ephemeral PostgreSQL
        run: npm run test:integration
      - name: Verify multi-vertical pack/tenant consistency (R-I-12)
        run: npm run multi-vertical:check

  rls-integration:
    name: RLS A/B isolation (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: rls_test
          POSTGRES_USER: core_engine
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine -d rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: rls_test
      PGUSER: core_engine
      PGPASSWORD: test_only
      CORE_ENGINE_APP_PASSWORD: probe_app_pw
      MIGRATIONS_DIR: ${{ github.workspace }}/infra/db
      RLS_TEST_DATABASE_URL: postgres://core_engine:test_only@127.0.0.1:5432/rls_test
      RLS_TEST_APP_URL: postgres://core_engine_app:probe_app_pw@127.0.0.1:5432/rls_test
      TZ: America/Managua
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Apply migrations + mandatory RLS
        run: sh infra/db/apply.sh
      - name: Re-apply migrations (idempotente, sin drift)
        run: sh infra/db/apply.sh
      - name: RLS A/B negative tests (users, orders, finance, storage)
        run: npm run test:rls

  matrix:
    name: Service matrix (service.json)
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Emit Rust matrix from service manifests (R-AF-3)
        id: set
        run: echo "include=$(node scripts/tools/ci-matrix.mjs)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: [security-gate, matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      TZ: America/Managua
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo audit (deuda aceptada; falla ante avisos nuevos)
        working-directory: ${{ matrix.dir }}
        run: |
          IGNORES=$(grep -E '^(RUSTSEC|GHSA)-' "$GITHUB_WORKSPACE/scripts/config/cargo-audit-ignores.txt" | sed 's/^/--ignore /' | tr '\n' ' ')
          cargo audit $IGNORES
      - name: rustfmt
        working-directory: ${{ matrix.dir }}
        run: cargo fmt --check
      - name: clippy
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests + cobertura
        working-directory: ${{ matrix.dir }}
        run: >-
          cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs'
          --fail-under-lines ${{ matrix.lines }} --fail-under-functions ${{ matrix.functions }}
      - name: Build Rust image (identity)
        if: matrix.service == 'identity-service'
        run: docker build -f packages/identity-service/Dockerfile -t core-engine-identity-service:ci .

  docker-build:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: [security-gate, matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image without push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: false
          tags: core-engine-${{ matrix.service }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

  build:
    name: Build all services
    runs-on: ubuntu-24.04
    needs: [rules-check, lint, integration-catalog, rls-integration, rust, docker-build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Gate G-8 — spec OpenAPI sincronizado (R-DO-6, R-C-7)
        run: npm run swagger:export && git diff --exit-code docs/openapi docs/api
      - name: Architecture catalog, event matrix and debt in sync (R-AF-4)
        run: npm run architecture:check
