name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    # Enmienda R-CI-1 (2026-10-22): los PRs apilados con base feat/** también
    # ejecutan CI, para que cada PR tenga checks verdes en su cabeza (R-PR-6).
    branches: [main, develop, staging, 'feat/**']
  workflow_dispatch:

# R-CI-2: un push nuevo cancela el run anterior de la misma rama/PR;
# prohibido apilar runs obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-check:
    name: Rules (docs/rules + commits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Test governance engine against false greens
        run: npm run test:engine
      - name: Test smoke runner against false greens and network stalls
        run: npm run test:smoke
      - name: Guard baselines against new debt or exceptions
        run: npm run baseline:guard -- --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - name: Validate project rules (R-CI-7, R-GC-1..4)
        run: node scripts/cli.mjs rules

  security-gate:
    name: Security Gate (npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Secret scan (R-DS-1 — docs/rules/data/02-seguridad.md)
        run: npm run security:secrets
      - name: Security audit (Regla R-QA-6 — docs/rules/test/07-qa-gates.md)
        run: npm audit --audit-level=high

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint TypeScript sources (Gate G-7 — docs/rules/test/06-estandares-cobertura.md)
        run: npm run lint

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-24.04
    needs: security-gate
    env:
      TZ: America/Managua
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build shared library
        run: npm run build -w @core/shared
      - name: Run tests with coverage
        # El script raíz `test` ya corre cada workspace con `--coverage`
        # (los umbrales viven en `scripts/config/coverage.mjs`).
        run: npm test
      - name: Compare coverage against baseline (R-COV-1)
        run: npm run coverage:compare
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: packages/*/coverage/
          retention-days: 7

  integration-catalog:
    name: API + BD contracts (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
      TZ: America/Managua
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build shared library for integration harness
        run: npm run build -w @core/shared
      - name: Build identity service for integration harness
        run: npm run build -w @core/identity-service
      - name: Build catalog and field services for the multi-vertical matrix
        run: |
          npm run build -w @core/catalog-service
          npm run build -w @core/field-service
      - name: Build orders, logistics, commissions and finance for the saga integration
        run: |
          npm run build -w @core/orders-service
          npm run build -w @core/logistics-service
          npm run build -w @core/commissions-service
          npm run build -w @core/finance-service
      - name: Verify catalog stock projection and API contracts against ephemeral PostgreSQL
        run: npm run test:integration
      - name: Verify multi-vertical pack/tenant consistency (R-I-12)
        run: npm run multi-vertical:check

  rust:
    name: Rust (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: security-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scheduling-service
            lines: 71
            functions: 65
          - service: notifications-service
            lines: 74
            functions: 74
    env:
      TZ: America/Managua
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/${{ matrix.service }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: rustfmt
        working-directory: packages/${{ matrix.service }}
        run: cargo fmt --check
      - name: clippy
        working-directory: packages/${{ matrix.service }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests + cobertura
        working-directory: packages/${{ matrix.service }}
        run: >-
          cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs'
          --fail-under-lines ${{ matrix.lines }} --fail-under-functions ${{ matrix.functions }}

  build:
    name: Build all services
    runs-on: ubuntu-24.04
    needs: [rules-check, test, lint, integration-catalog, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build all packages
        run: npm run build
      - name: Gate G-8 — spec OpenAPI sincronizado (R-DO-6, R-C-7)
        run: npm run swagger:export && git diff --exit-code docs/openapi docs/api packages/api-gateway/src/openapi.agregado.ts
