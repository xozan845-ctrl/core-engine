name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

# R-CI-2: un push nuevo cancela el run anterior de la misma rama/PR;
# prohibido apilar runs obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-check:
    name: Rules (docs/rules + commits)
    # Determinista en PR y en push a main; evita comparar ramas de largo recorrido
    # en pushes de develop/staging (donde el diff contra main sería enorme).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Test governance engine against false greens
        run: npm run test:engine
      - name: Test smoke runner against false greens and network stalls
        run: npm run test:smoke
      - name: Validate project rules (R-CI-7, R-GC-1..4)
        run: node scripts/check-rules.mjs

  security-gate:
    name: Security Gate (npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Secret scan (R-DS-1 — docs/rules/data/02-seguridad.md)
        run: npm run security:secrets
      - name: Security audit (Regla R-QA-6 — docs/rules/test/07-qa-gates.md)
        run: npm audit --audit-level=high

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint TypeScript sources (Gate G-7 — docs/rules/test/06-estandares-cobertura.md)
        run: npm run lint

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build shared library
        run: npm run build -w @core/shared
      - name: Run tests with coverage
        # El script raíz `test` ya corre cada workspace con `--coverage`
        # (los umbrales viven en `scripts/config/coverage.mjs`).
        run: npm test
      - name: Compare coverage against baseline (R-COV-1)
        run: npm run coverage:compare
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: packages/*/coverage/
          retention-days: 7

  integration-catalog:
    name: Catalog stock (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
      TZ: America/Managua
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Verify stock projection against ephemeral PostgreSQL
        run: npm run test:integration

  build:
    name: Build all services
    runs-on: ubuntu-24.04
    needs: [test, lint, integration-catalog]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build all packages
        run: npm run build
      - name: Gate G-8 — spec OpenAPI sincronizado (R-DO-6, R-C-7)
        run: npm run swagger:export && git diff --exit-code docs/openapi docs/api packages/api-gateway/src/openapi.agregado.ts
