name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    # Enmienda R-CI-1 (2026-10-22): los PRs apilados con base feat/** también
    # ejecutan CI, para que cada PR tenga checks verdes en su cabeza (R-PR-6).
    branches: [main, develop, staging, 'feat/**']
  workflow_dispatch:

# R-CI-2: un push nuevo cancela el run anterior de la misma rama/PR;
# prohibido apilar runs obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-check:
    name: Rules (docs/rules + commits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Test governance engine against false greens
        run: npm run test:engine
      - name: Test smoke runner against false greens and network stalls
        run: npm run test:smoke
      - name: Guard baselines against new debt or exceptions
        run: npm run baseline:guard -- --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - name: Validate project rules (R-CI-7, R-GC-1..4)
        run: node scripts/cli.mjs rules

  security-gate:
    name: Security Gate (npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Secret scan (R-DS-1 — docs/rules/data/02-seguridad.md)
        run: npm run security:secrets
      - name: Security audit (Regla R-QA-6 — docs/rules/test/07-qa-gates.md)
        run: npm audit --audit-level=high

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint de scripts de gobernanza (Gate G-7 — docs/rules/test/06-estandares-cobertura.md)
        run: npm run lint

  integration-catalog:
    name: API + BD contracts (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
      TZ: America/Managua
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Verify catalog stock projection and API contracts against ephemeral PostgreSQL
        run: npm run test:integration
      - name: Verify multi-vertical pack/tenant consistency (R-I-12)
        run: npm run multi-vertical:check

  rust:
    name: Rust (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: security-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scheduling-service
            dir: packages/scheduling-service
            lines: 71
            functions: 65
          - service: notifications-service
            dir: packages/notifications-service
            lines: 74
            functions: 74
          - service: commissions-service
            dir: packages/commissions-service
            lines: 72
            functions: 68
          - service: field-service
            dir: packages/field-service
            lines: 77
            functions: 71
          - service: logistics-service
            dir: packages/logistics-service
            lines: 63
            functions: 62
          - service: market-intelligence-service
            dir: packages/market-intelligence-service
            lines: 63
            functions: 60
          - service: stores-service
            dir: packages/stores-service
            lines: 76
            functions: 76
          - service: item-service
            dir: packages/item-service
            lines: 40
            functions: 43
          - service: inventory-service
            dir: packages/inventory-service
            lines: 79
            functions: 72
          - service: pricing-service
            dir: packages/pricing-service
            lines: 53
            functions: 52
          - service: storage-service
            dir: packages/storage-service
            lines: 53
            functions: 52
          - service: orders-service
            dir: packages/orders-service
            lines: 62
            functions: 63
          - service: finance-service
            dir: packages/finance-service
            lines: 52
            functions: 45
          - service: api-gateway
            dir: packages/api-gateway
            lines: 78
            functions: 73
          - service: identity-service
            dir: packages/identity-service
            lines: 79
            functions: 75
          - service: analytics-service
            dir: packages/analytics-service
            lines: 50
            functions: 45
    env:
      TZ: America/Managua
      TEST_DATABASE_URL: postgres://core_engine_test:test_only@127.0.0.1:5432/core_engine_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: core_engine_test
          POSTGRES_USER: core_engine_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_engine_test -d core_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo audit (deuda aceptada; falla ante avisos nuevos)
        working-directory: ${{ matrix.dir }}
        run: |
          IGNORES=$(grep -E '^(RUSTSEC|GHSA)-' "$GITHUB_WORKSPACE/scripts/config/cargo-audit-ignores.txt" | sed 's/^/--ignore /' | tr '\n' ' ')
          cargo audit $IGNORES
      - name: rustfmt
        working-directory: ${{ matrix.dir }}
        run: cargo fmt --check
      - name: clippy
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests + cobertura
        working-directory: ${{ matrix.dir }}
        run: >-
          cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs'
          --fail-under-lines ${{ matrix.lines }} --fail-under-functions ${{ matrix.functions }}
      - name: Build Rust image (identity)
        if: matrix.service == 'identity-service'
        run: docker build -f packages/identity-service/Dockerfile -t core-engine-identity-service:ci .

  build:
    name: Build all services
    runs-on: ubuntu-24.04
    needs: [rules-check, lint, integration-catalog, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Gate G-8 — spec OpenAPI sincronizado (R-DO-6, R-C-7)
        run: npm run swagger:export && git diff --exit-code docs/openapi docs/api
