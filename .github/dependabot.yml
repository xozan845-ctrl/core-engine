version: 2
# Las actualizaciones apuntan a la rama de integración (R-GE-2): el trabajo
# nace en `develop` y a `main` solo llega por promoción (`staging → main`).
# Sin `target-branch`, Dependabot usa la rama por defecto (`main`).
updates:
  # Acciones de GitHub usadas por los workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    # Todas las acciones en un solo PR: se verifican por la misma vía (CI) y
    # llegan sueltas una por semana.
    groups:
      actions:
        patterns:
          - "*"

  # Dependencias del workspace npm (raíz = todos los workspaces).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    # Agrupación por familia: estas dependencias DEBEN moverse en bloque. Por
    # separado ni resuelven (`ERESOLVE`) ni compilan (tipos duplicados), que es
    # el origen de los PR rojos que hubo que reagrupar a mano (vitest 5,
    # amqplib 2, NestJS 12). Los grupos incluyen majors por defecto.
    groups:
      nestjs:
        # `@nestjs/*` se mueve junto: un salto parcial deja dos copias de
        # `@nestjs/common` (una en la raíz y otra en el workspace) y el
        # typecheck falla con dos `INestApplication` incompatibles.
        patterns:
          - "@nestjs/*"
      vitest:
        # `@vitest/coverage-v8` fija la major de `vitest` como peer.
        patterns:
          - "vitest"
          - "@vitest/*"
      amqplib:
        patterns:
          - "amqplib"
          - "@types/amqplib"
      # Tipos en un solo PR (revisión trivial: solo typecheck). Si un major
      # rompe el grupo, se puede sacar del grupo y subir a mano.
      types:
        patterns:
          - "@types/*"
    # NestJS 12 está bloqueado por un peer de upstream (ver PRs #189/#190/#193/
    # #195 y #207): `@nestjs/swagger@12` declara
    # `peerOptional typescript@^5.5 || ^6` y el repo va en TypeScript 7, así que
    # `npm install` da ERESOLVE; con swagger 11 + NestJS 12 npm anida un
    # `@nestjs/common` duplicado y el typecheck falla. Sin este `ignore`, el
    # grupo `nestjs` abriría un PR rojo cada semana. `update-types` no afecta a
    # las actualizaciones de seguridad, así que esas siguen llegando.
    # QUITAR esta entrada cuando `@nestjs/swagger` declare compatibilidad con
    # TypeScript 7: entonces el grupo `nestjs` traerá los 4 paquetes + swagger
    # en un único PR verde.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types:
          - "version-update:semver-major"
