# Core Engine · STAGE (imágenes de GHCR)
# Consume las imágenes publicadas por release.yml y promovidas por promote.yml
# (`:stage`), SIN reconstruir (R-CD-3).
#
# Variables (R-CD-7): el compose lee el archivo que indique `ENV_FILE` y, por
# defecto, `.env` — el mismo que escribe Dockploy desde la pestaña *Environment*,
# de modo que el despliegue no depende de un archivo que el VPS no tiene.
# En local: copiar `.env.stage.example` → `.env.stage` y
#   ENV_FILE=.env.stage docker compose -f docker-compose.stage.yml up -d
#
# Solo se publica el gateway (8080); Postgres y RabbitMQ quedan internos a la red
# `core-engine`. La observabilidad es opcional:
#   docker compose -f docker-compose.stage.yml -f docker-compose.observability.yml up -d
# `commissions-service` y `market-intelligence-service` no entran en este
# compose: viven en `docker-compose.dev.yml` (desarrollo).

x-servicio-base: &servicio-base
  env_file:
    - ${ENV_FILE:-.env}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - core-engine
  restart: unless-stopped

services:
  # ── Datos y BaaS (AD-08: Supabase-compatible, SQL estandar en Docker) ──
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_engine}
      POSTGRES_USER: ${POSTGRES_USER:-core_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Solo el esquema estandar entra en Docker local; 99_rls.sql (Supabase)
      # vive en infra/db/supabase/ y se aplica manualmente en staging/prod.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core_engine} -d ${POSTGRES_DB:-core_engine}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Broker de mensajeria (AD-02: RabbitMQ con DLQ) ─────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # (barrido A07/A08): guest deshabilitado en loopback. La credencial viene del
    # entorno (RABBITMQ_USER/RABBITMQ_PASSWORD), nunca de un fichero commiteado (R-CD-7).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-core-engine}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD requerida}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Almacenamiento de objetos (ADR-24: un bucket por tenant) ───────────
  # El puerto 9000 se publica porque es el host FIRMADO en las URLs
  # prefirmadas (MINIO_PUBLIC_ENDPOINT): el cliente sube/descarga directo sin
  # pasar por el servicio. La consola (9001) NO se publica.
  minio:
    # Espejo del MinIO oficial: `minio/minio` no esta disponible en este entorno.
    # Fijado por DIGEST (= RELEASE.2025-09-07T16-13-09Z) para que sea inmutable.
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    command: server /data --console-address ":9001"
    environment:
      # Sin MINIO_* propias la credencial se deriva del secreto de RabbitMQ
      # del entorno (fuerte y ya presente): asi un deploy no falla entero por
      # faltar la variable. Pega MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
      # dedicadas cuando puedas: tienen prioridad (R-CD-7).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-core-engine-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${RABBITMQ_PASSWORD}}
    volumes:
      - minio_data:/data
    # Solo loopback: Traefik (Dockploy) alcanza el servicio por la red de Docker;
    # el acceso publico va por el dominio HTTPS (storage.kbcoleccion.com).
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - core-engine

  # ── API Gateway (punto de entrada unico) ───────────────────────────────
  gateway:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-api-gateway:stage
    pull_policy: always
    environment:
      SERVICIO: api-gateway
      PORT: 8080
      OUTBOX_TABLA: identity.outbox
      # Staging mantiene el gate: el arranque falla si EDGE_BASIC_AUTH no llega.
      # Los origenes listados en EDGE_BASIC_BYPASS_ORIGINS (demo publico) se
      # eximen; el resto sigue exigiendo Basic.
      REQUIRE_EDGE_AUTH: "true"
    # Solo loopback: el proxy de borde (Traefik/Dockploy) alcanza el gateway por
    # el puerto publicado, pero el puerto NO queda expuesto a Internet en HTTP
    # plano (H-01). Si el proxy corre en otro contenedor, conectar ambos por la
    # red `core-engine` y enrutar a `gateway:8080` en vez de publicar el puerto.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - core-engine

  # ── Microservicios por dominio (Tabla 7) ───────────────────────────────
  identity-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-identity-service:stage
    pull_policy: always
    environment:
      SERVICIO: identity-service
      PORT: 3001
      OUTBOX_TABLA: identity.outbox

  catalog-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-catalog-service:stage
    pull_policy: always
    environment:
      SERVICIO: catalog-service
      PORT: 3002
      OUTBOX_TABLA: catalog.outbox

  stores-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-stores-service:stage
    pull_policy: always
    environment:
      SERVICIO: stores-service
      PORT: 3003
      OUTBOX_TABLA: stores.outbox

  orders-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-orders-service:stage
    pull_policy: always
    environment:
      SERVICIO: orders-service
      PORT: 3004
      OUTBOX_TABLA: orders.outbox

  logistics-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-logistics-service:stage
    pull_policy: always
    environment:
      SERVICIO: logistics-service
      PORT: 3005
      OUTBOX_TABLA: logistics.outbox

  finance-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-finance-service:stage
    pull_policy: always
    environment:
      SERVICIO: finance-service
      PORT: 3007
      OUTBOX_TABLA: finance.outbox
      COMMISSION_RATE: 0.12

  field-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-field-service:stage
    pull_policy: always
    environment:
      SERVICIO: field-service
      PORT: 3008
      OUTBOX_TABLA: field.outbox

  storage-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-storage-service:stage
    pull_policy: always
    environment:
      SERVICIO: storage-service
      PORT: 3010
      OUTBOX_TABLA: storage.outbox

volumes:
  pg_data:
  rabbitmq_data:
  minio_data:

networks:
  core-engine:
    name: core-engine