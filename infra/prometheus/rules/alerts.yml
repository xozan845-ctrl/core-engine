# Reglas de alerta para Core Engine Core Engine
groups:
  - name: core-engine-critical
    rules:

    # --- Servicios caídos ---
    - alert: ServicioCaido
      expr: absent(up{job="core-engine-servicios"} == 1)
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Servicio caído ({{ $labels.instance }})"
        description: "El servicio {{ $labels.instance }} no responde /metrics"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#servicio-caido"

    # --- Event loop lag crítico ---
    - alert: EventLoopLagAlto
      expr: nodejs_eventloop_lag_p99_seconds{job=~"core-engine-servicios"} > 0.1
      for: 2m
      labels: { severity: critical }
      annotations:
        summary: "Event loop lag > 100ms ({{ $labels.instance }})"
        description: "El servicio {{ $labels.instance }} tiene lag > 100ms"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#event-loop-y-memoria"

    # --- GC duration ---
    - alert: GCDurationAlto
      expr: rate(nodejs_gc_duration_seconds_sum{kind="major"}[5m]) / rate(nodejs_gc_duration_seconds_count{kind="major"}[5m]) > 1
      for: 3m
      labels: { severity: warning }
      annotations:
        summary: "Major GC > 1s ({{ $labels.instance }})"
        description: "GC mayor duración promedio > 1 segundo"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#event-loop-y-memoria"

    # --- Heap usage (nota: high ratio es normal en V8; se alerta solo si heap_used > 500MB) ---
    - alert: HeapUsageCritico
      expr: nodejs_heap_size_used_bytes{job=~"core-engine-servicios"} > 500 * 1024 * 1024
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "Heap usage > 500MB ({{ $labels.instance }})"
        description: "Servicio {{ $labels.instance }} usando >500MB de heap V8"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#event-loop-y-memoria"

    # --- Postgres ---
    - alert: PostgresConexionesAltas
      expr: pg_stat_database_numbackends{datname="core-engine"} > 80
      for: 1m
      labels: { severity: warning }
      annotations:
        summary: "Muchas conexiones PG ({{ $value }} activas)"
        description: "PostgreSQL tiene {{ $value }} conexiones activas (>80)"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#postgresql"

    - alert: PostgresCacheHitBajo
      expr: (pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read)) * 100 < 95
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Cache hit ratio < 95% en PostgreSQL"
        description: "Cache hit ratio cayó a {{ $value }}%"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#postgresql"

    - alert: PostgresDeadTuplesAltos
      expr: sum(pg_stat_user_tables_n_dead_tup) > 100
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Dead tuples acumulados (>100)"
        description: "PostgreSQL tiene {{ $value }} dead tuples acumulados"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#postgresql"

    # --- RabbitMQ ---
    - alert: RabbitMQQueueBacklog
      expr: max by (queue) (rabbitmq_queue_messages) > 1000
      for: 1m
      labels: { severity: warning }
      annotations:
        summary: "Queue backlog ({{ $labels.queue }}): {{ $value }} mensajes"
        description: "La cola {{ $labels.queue }} supera 1000 mensajes durante al menos un minuto"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#rabbitmq-y-dlq"

    # La presencia de mensajes muertos es normal; se alerta solo si la DLQ
    # mantiene crecimiento neto durante una ventana sostenida (R-TM-5).
    - alert: RabbitMQDLQCrecimientoSostenido
      expr: delta(rabbitmq_queue_messages{queue=~".*\\.dlq$"}[15m]) > 0
      for: 15m
      labels: { severity: critical }
      annotations:
        summary: "DLQ {{ $labels.queue }} crece de forma sostenida"
        description: "La DLQ acumuló mensajes durante 15 minutos; inspeccionar errores y pausar la reinyección si el fallo persiste"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#rabbitmq-y-dlq"

    - alert: RabbitMQLowConsumers
      expr: sum(rabbitmq_queue_consumers) < 3
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "Menos de 3 consumidores en RabbitMQ"
        description: "Solo {{ $value }} consumidores activos"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#rabbitmq-y-dlq"

    # --- HTTP ---
    - alert: HTTPErrorRateAlto
      expr: sum(rate(core_engine_http_server_errors_total[5m])) / clamp_min(sum(rate(core_engine_http_requests_total[5m])), 1e-9) * 100 > 5
      for: 1m
      labels: { severity: critical }
      annotations:
        summary: "Tasa de error 5xx > 5% ({{ $value }}%)"
        description: "Error rate HTTP 5xx elevada"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#errores-http"

    - alert: HTTPCredencialesRechazadas
      expr: sum(rate(core_engine_http_relevant_client_errors_total{estado=~"401|403"}[5m])) > 5
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Tasa elevada de respuestas 401/403"
        description: "Revisar intentos por ruta y origen; puede indicar credenciales mal configuradas o ataque"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#errores-http"

    - alert: HTTPConflictosNegocio
      expr: sum(rate(core_engine_http_relevant_client_errors_total{estado="409"}[5m])) > 10
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Tasa elevada de conflictos HTTP 409"
        description: "Revisar colisiones de stock o concurrencia por ruta antes de escalar capacidad"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#errores-http"

    - alert: HTTPLatenciaAlta
      expr: histogram_quantile(0.99, sum by (servicio, le) (rate(core_engine_http_request_duration_seconds_bucket[5m]))) > 0.8
      for: 2m
      labels: { severity: warning }
      annotations:
        summary: "Latencia p99 > 800ms ({{ $labels.servicio }})"
        description: "Servicio {{ $labels.servicio }} con latencia p99 = {{ $value }}ms"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#latencia-http"

    # --- Sistema ---
    - alert: ContainerMemoriaAlta
      expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100 > 90) and (container_spec_memory_limit_bytes{name!=""} > 0)
      for: 2m
      labels: { severity: warning }
      annotations:
        summary: "Memory uso > 90% ({{ $labels.name }})"
        description: "Contenedor {{ $labels.name }} usa {{ $value }}% de memoria límite"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#event-loop-y-memoria"

    - alert: DiskUsageCritico
      expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 90
      for: 1m
      labels: { severity: critical }
      annotations:
        summary: "Disco > 90% usado ({{ $labels.instance }})"
        description: "Filesystem en {{ $labels.instance }} está {{ $value }}% lleno"
        runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md#disco"
