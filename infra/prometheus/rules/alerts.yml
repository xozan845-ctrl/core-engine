# Alertas de Core Engine para un stack Rust.
# Las métricas nodejs_* de la etapa NestJS se retiraron: no existen en runtime.
groups:
  - name: core-engine-disponibilidad
    rules:
      - alert: ServicioCaido
        expr: up{job="core-engine-servicios"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servicio caído ({{ $labels.instance }})"
          description: "{{ $labels.instance }} no responde a /metrics desde hace 1 minuto."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: ServicioSinMetricas
        expr: absent(up{job="core-engine-servicios"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No hay ninguna serie de servicios"
          description: "Prometheus no ve ningún target de core-engine; revisar scrape o red."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

  - name: core-engine-http
    rules:
      - alert: Errores5xxAltos
        expr: |
          sum by (servicio) (rate(core_engine_http_server_errors_total{job="core-engine-servicios"}[5m]))
          /
          clamp_min(sum by (servicio) (rate(core_engine_http_requests_total{job="core-engine-servicios"}[5m])), 1)
          > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx > 2% en {{ $labels.servicio }}"
          description: "La tasa de errores 5xx de {{ $labels.servicio }} supera el 2% durante 5 minutos."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (le, servicio) (rate(core_engine_http_request_duration_seconds_bucket{job="core-engine-servicios"}[5m]))
          ) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 > 1,5 s en {{ $labels.servicio }}"
          description: "El p95 de {{ $labels.servicio }} lleva 10 minutos por encima de 1,5 s."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: Errores401403Altos
        expr: sum by (servicio) (rate(core_engine_http_relevant_client_errors_total{estado=~"401|403"}[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "401/403 elevados en {{ $labels.servicio }}"
          description: "Muchos rechazos de autenticación/autorización; revisar credenciales, políticas o ataque."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: Conflictos409Altos
        expr: sum by (servicio) (rate(core_engine_http_relevant_client_errors_total{estado="409"}[5m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Conflictos 409 elevados en {{ $labels.servicio }}"
          description: "Posible contención de stock, idempotencia o concurrencia."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

  - name: core-engine-outbox
    rules:
      - alert: OutboxBacklog
        expr: max by (instance) (core_engine_outbox_pending_events) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox con backlog en {{ $labels.instance }}: {{ $value }}"
          description: "El relay no drena la tabla outbox; revisar RabbitMQ, confirmaciones y errores del poller."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: OutboxFallosPublicacion
        expr: sum by (instance) (rate(core_engine_outbox_publish_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fallos de publicación del Outbox en {{ $labels.instance }}"
          description: "Hay fallos sostenidos al publicar eventos; revisar broker y DLQ."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

  - name: core-engine-rabbitmq
    rules:
      - alert: RabbitMQQueueBacklog
        expr: max by (queue) (rabbitmq_queue_messages) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cola {{ $labels.queue }} con {{ $value }} mensajes"
          description: "La cola supera 1000 mensajes durante 5 minutos."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: RabbitMQDLQCrecimientoSostenido
        expr: delta(rabbitmq_queue_messages{queue=~".*\\.dlq$"}[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "DLQ {{ $labels.queue }} crece"
          description: "La DLQ acumula mensajes durante 15 minutos; inspeccionar errores."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: RabbitMQSinConsumidores
        expr: sum(rabbitmq_queue_consumers) < 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Menos de 3 consumidores activos"
          description: "Solo {{ $value }} consumidores; los eventos no se están procesando."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

  - name: core-engine-postgres
    rules:
      - alert: PostgresConexionesAltas
        expr: pg_stat_database_numbackends{datname=~"core_engine.*"} > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL con {{ $value }} conexiones"
          description: "Supera 80 conexiones; revisar pools o PgBouncer."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: PostgresCacheHitBajo
        expr: |
          (pg_stat_database_blks_hit{datname=~"core_engine.*"}
           / clamp_min(pg_stat_database_blks_hit{datname=~"core_engine.*"} + pg_stat_database_blks_read{datname=~"core_engine.*"}, 1)) * 100 < 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cache hit < 95% en PostgreSQL"
          description: "El cache hit cayó a {{ $value }}%."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: PostgresDeadTuplesAltos
        expr: sum(pg_stat_user_tables_n_dead_tup) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dead tuples acumulados (>1000)"
          description: "Revisar autovacuum y programar mantenimiento."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

  - name: core-engine-infra
    rules:
      - alert: DiscoBajo
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
           / clamp_min(node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}, 1)) < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disco raíz por debajo del 15%"
          description: "Liberar espacio o ampliar el volumen."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"

      - alert: ContenedorMemoriaAlta
        expr: |
          (container_memory_working_set_bytes{name=~".+"}
           / clamp_min(container_spec_memory_limit_bytes{name=~".+"}, 1)) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Contenedor {{ $labels.name }} al 90% de memoria"
          description: "Revisar fuga o subir el límite."
          runbook_url: "https://github.com/xozan845-ctrl/core-engine/blob/develop/docs/runbook-observabilidad.md"
