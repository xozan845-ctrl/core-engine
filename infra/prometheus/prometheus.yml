# Configuracion de Prometheus (doc 5.3: metricas y dashboards)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Microservicios (NestJS, prom-client) ───────────────────────────────
  - job_name: 'bodegahub-servicios'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'gateway:8080'
          - 'identity-service:3001'
          - 'catalog-service:3002'
          - 'stores-service:3003'
          - 'orders-service:3004'
          - 'logistics-service:3005'
          - 'commissions-service:3006'
          - 'finance-service:3007'
        labels:
          plataforma: bodegahub

  # ── Exportadores de infraestructura ──────────────────────────────────
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          plataforma: bodegahub

  - job_name: 'rabbitmq-exporter'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
        labels:
          plataforma: bodegahub

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          plataforma: bodegahub

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          plataforma: bodegahub

rule_files:
  - "rules/alerts.yml"
