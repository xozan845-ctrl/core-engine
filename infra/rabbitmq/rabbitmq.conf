# Core Engine RabbitMQ — hardening (barrido A07/A08)
# guest deshabilitado incluso en loopback; acceso solo con credencial dedicada.
#
# La credencial (usuario/contraseña) NO vive aquí: se inyecta por entorno desde
# `RABBITMQ_USER` / `RABBITMQ_PASSWORD` (variables del compose → service). Así el
# secreto es único por entorno y no hay un secreto commiteado en el repo (R-CD-7).
loopback_users.guest = false
default_vhost = /
