# Alertmanager · Core Engine
# El webhook se expande desde ALERTMANAGER_WEBHOOK_URL (--config.expand-env).
# Sin URL configurada, las alertas siguen visibles en la UI de Alertmanager.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, servicio, instancia]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: critical
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: default
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL}
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL}
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, servicio]
