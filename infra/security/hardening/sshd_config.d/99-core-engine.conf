# /etc/ssh/sshd_config.d/99-core-engine.conf
# Endurecimiento SSH: solo HMAC/KEX/cifrados modernos (sin SHA-1).
# Validar con `sshd -t` y mantener una sesion abierta antes de recargar.
#
# Referencia: OpenSSH 10.x. Ajusta si tu version no soporta sntrup761x25519.

MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com

# Politica de acceso (descomentar solo si aplica a tu operacion):
# PermitRootLogin prohibit-password
# PasswordAuthentication no
