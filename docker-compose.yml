# Core Engine · PRODUCCIÓN (imágenes de GHCR)
# Consume las imágenes publicadas por release.yml y promovidas por promote.yml
# (`:prod`), SIN reconstruir (R-CD-3).
#
# Variables (R-CD-7): el compose lee el archivo que indique `ENV_FILE` y, por
# defecto, `.env` — el mismo que escribe Dockploy desde la pestaña *Environment*,
# de modo que el despliegue no depende de un archivo que el VPS no tiene.
# En local: copiar `.env.production.example` → `.env.production` y
#   ENV_FILE=.env.production docker compose -f docker-compose.yml up -d
#
# Solo se publica el gateway (8080); Postgres y RabbitMQ quedan internos a la red
# `core-engine`. La observabilidad es opcional:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# `commissions-service` no entra en este compose (producción): se despliega
# en stage (ADR-37). `market-intelligence-service` se despliega en stage y
# producción desde la Fase 6 (analítica transversal).
#
# Entornos (3): producción = este archivo · pre-producción = `docker-compose.stage.yml`
# · desarrollo = `docker-compose.dev.yml` (construye local).

x-servicio-base: &servicio-base
  env_file:
    - ${ENV_FILE:-.env}
  environment:
    TZ: America/Managua
  depends_on:
    db-migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - core-engine
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$PORT/health >/dev/null || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  # ── Datos y BaaS (AD-08: Supabase-compatible, SQL estandar en Docker) ──
  postgres:
    image: postgis/postgis:16-3.4-alpine
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=off"
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_engine}
      POSTGRES_USER: ${POSTGRES_USER:-core_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida en .env}
      CORE_ENGINE_APP_PASSWORD: ${CORE_ENGINE_APP_PASSWORD:?CORE_ENGINE_APP_PASSWORD requerida}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Solo el esquema estandar entra en Docker local; 99_rls.sql (Supabase)
      # vive en infra/db/supabase/ y se aplica manualmente en staging/prod.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core_engine} -d ${POSTGRES_DB:-core_engine}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Migraciones versionadas con ledger (R-DB-6) ───────────────────────
  db-migrate:
    image: postgis/postgis:16-3.4-alpine
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-core_engine}
      PGUSER: ${POSTGRES_USER:-core_engine}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      CORE_ENGINE_APP_PASSWORD: ${CORE_ENGINE_APP_PASSWORD:?CORE_ENGINE_APP_PASSWORD requerida}
      MIGRATIONS_DIR: /migrations
      APPLY_RLS: "false"
    volumes:
      - ./infra/db:/migrations:ro
    command: ["sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core-engine
    restart: "no"

  # ── Backup lógico diario (ADR-0044) ────────────────────────────────────
  # Dump custom con retención local. El envío fuera del host se hace desde
  # `backup.yml` o el almacenamiento externo que configure operación.
  db-backup:
    image: postgres:16-alpine
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-core_engine}
      PGUSER: ${POSTGRES_USER:-core_engine}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      # El dump necesita un rol con BYPASSRLS (owner); DATABASE_URL del .env
      # apunta a core_engine_app y pg_dump fallaria en tablas con RLS.
      DATABASE_URL: ${POSTGRES_URL:-}
      BACKUP_DIR: /backups
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-14}
      BACKUP_INTERVALO_SEGUNDOS: ${BACKUP_INTERVALO_SEGUNDOS:-86400}
    volumes:
      - ./infra/db/backup.sh:/usr/local/bin/backup.sh:ro
      - ./infra/db/restore-verify.sh:/usr/local/bin/restore-verify.sh:ro
      - db_backups:/backups
    command:
      - sh
      - -c
      - while true; do sh /usr/local/bin/backup.sh || true; sleep "$$BACKUP_INTERVALO_SEGUNDOS"; done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core-engine
    restart: unless-stopped

  # ── Broker de mensajeria (AD-02: RabbitMQ con DLQ) ─────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # (barrido A07/A08): guest deshabilitado en loopback. La credencial viene del
    # entorno (RABBITMQ_USER/RABBITMQ_PASSWORD), nunca de un fichero commiteado (R-CD-7).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-core-engine}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD requerida}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Almacenamiento de objetos (ADR-24: un bucket por tenant) ───────────
  # El puerto 9000 se publica porque es el host FIRMADO en las URLs
  # prefirmadas (MINIO_PUBLIC_ENDPOINT): el cliente sube/descarga directo sin
  # pasar por el servicio. La consola (9001) NO se publica.
  minio:
    # Espejo del MinIO oficial: `minio/minio` no esta disponible en este entorno.
    # Fijado por DIGEST (= RELEASE.2025-09-07T16-13-09Z) para que sea inmutable.
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    command: server /data --console-address ":9001"
    environment:
      # Sin MINIO_* propias la credencial se deriva del secreto de RabbitMQ
      # del entorno (fuerte y ya presente): asi un deploy no falla entero por
      # faltar la variable. Pega MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
      # dedicadas cuando puedas: tienen prioridad (R-CD-7).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-core-engine-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${RABBITMQ_PASSWORD}}
    volumes:
      - minio_data:/data
    # Solo loopback: Traefik (Dockploy) alcanza el servicio por la red de Docker;
    # el acceso publico va por el dominio HTTPS.
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - core-engine

  # ── API Gateway (punto de entrada unico) ───────────────────────────────
  gateway:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-api-gateway:prod
    pull_policy: always
    environment:
      SERVICIO: api-gateway
      PORT: 8080
      OUTBOX_TABLA: identity.outbox
    # Solo loopback: el gateway no se publica en HTTP plano. El proxy de borde
    # (Traefik/Dockploy) enruta el trafico TLS hacia este puerto.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - core-engine

  # ── Microservicios por dominio (Tabla 7) ───────────────────────────────
  identity-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-identity-service:prod
    pull_policy: always
    environment:
      SERVICIO: identity-service
      PORT: 3001
      OUTBOX_TABLA: identity.outbox

  item-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-item-service:prod
    pull_policy: always
    environment:
      SERVICIO: item-service
      PORT: 3015
      OUTBOX_TABLA: item.outbox

  inventory-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-inventory-service:prod
    pull_policy: always
    environment:
      SERVICIO: inventory-service
      PORT: 3013
      OUTBOX_TABLA: inventory.outbox

  pricing-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-pricing-service:prod
    pull_policy: always
    environment:
      SERVICIO: pricing-service
      PORT: 3014
      OUTBOX_TABLA: pricing.outbox

  stores-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-stores-service:prod
    pull_policy: always
    environment:
      SERVICIO: stores-service
      PORT: 3003
      OUTBOX_TABLA: stores.outbox

  orders-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-orders-service:prod
    pull_policy: always
    environment:
      SERVICIO: orders-service
      PORT: 3004
      OUTBOX_TABLA: orders.outbox

  scheduling-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-scheduling-service:prod
    pull_policy: always
    environment:
      SERVICIO: scheduling-service
      PORT: 3011
      OUTBOX_TABLA: scheduling.outbox

  logistics-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-logistics-service:prod
    pull_policy: always
    environment:
      SERVICIO: logistics-service
      PORT: 3005
      OUTBOX_TABLA: logistics.outbox

  finance-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-finance-service:prod
    pull_policy: always
    environment:
      SERVICIO: finance-service
      PORT: 3007
      OUTBOX_TABLA: finance.outbox
      COMMISSION_RATE: 0.12

  field-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-field-service:prod
    pull_policy: always
    environment:
      SERVICIO: field-service
      PORT: 3008
      OUTBOX_TABLA: field.outbox

  market-intelligence-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-market-intelligence-service:prod
    pull_policy: always
    environment:
      SERVICIO: market-intelligence-service
      PORT: 3009
      OUTBOX_TABLA: intelligence.outbox
  analytics-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-analytics-service:prod
    pull_policy: always
    environment:
      SERVICIO: analytics-service
      PORT: 3016


  storage-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-storage-service:prod
    pull_policy: always
    environment:
      SERVICIO: storage-service
      PORT: 3010
      OUTBOX_TABLA: storage.outbox

  notifications-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-notifications-service:prod
    pull_policy: always
    environment:
      SERVICIO: notifications-service
      PORT: 3012

volumes:
  pg_data:
  rabbitmq_data:
  minio_data:
  db_backups:

networks:
  core-engine:
    name: core-engine
