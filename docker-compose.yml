# Core Engine · PRODUCCIÓN (imágenes de GHCR)
# Consume las imágenes publicadas por release.yml y promovidas por promote.yml
# (`:prod`), SIN reconstruir (R-CD-3). Requiere `docker login ghcr.io`.
#
# Variables: copiar `.env.production.example` → `.env.production` (sin commitear, R-CD-7).
# Arranque:  docker compose up -d
#
# Solo se publica el gateway (8080); Postgres y RabbitMQ quedan internos a la red
# `core-engine`. La observabilidad es opcional:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# `commissions-service` y `market-intelligence-service` no entran en este
# compose (producción); viven en `docker-compose.dev.yml` (desarrollo).
#
# Entornos (3): producción = este archivo · pre-producción = `docker-compose.stage.yml`
# · desarrollo = `docker-compose.dev.yml` (construye local).

x-servicio-base: &servicio-base
  env_file:
    - .env.production
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - core-engine
  restart: unless-stopped

services:
  # ── Datos y BaaS (AD-08: Supabase-compatible, SQL estandar en Docker) ──
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_engine}
      POSTGRES_USER: ${POSTGRES_USER:-core_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Solo el esquema estandar entra en Docker local; 99_rls.sql (Supabase)
      # vive en infra/db/supabase/ y se aplica manualmente en staging/prod.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core_engine} -d ${POSTGRES_DB:-core_engine}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Broker de mensajeria (AD-02: RabbitMQ con DLQ) ─────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # (barrido A07/A08): guest deshabilitado en loopback. La credencial viene del
    # entorno (RABBITMQ_USER/RABBITMQ_PASSWORD), nunca de un fichero commiteado (R-CD-7).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-core-engine}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD requerida}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── API Gateway (punto de entrada unico) ───────────────────────────────
  gateway:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-api-gateway:prod
    pull_policy: always
    environment:
      SERVICIO: api-gateway
      PORT: 8080
      OUTBOX_TABLA: identity.outbox
    ports:
      - "8080:8080"
    networks:
      - core-engine

  # ── Microservicios por dominio (Tabla 7) ───────────────────────────────
  identity-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-identity-service:prod
    pull_policy: always
    environment:
      SERVICIO: identity-service
      PORT: 3001
      OUTBOX_TABLA: identity.outbox

  catalog-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-catalog-service:prod
    pull_policy: always
    environment:
      SERVICIO: catalog-service
      PORT: 3002
      OUTBOX_TABLA: catalog.outbox

  stores-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-stores-service:prod
    pull_policy: always
    environment:
      SERVICIO: stores-service
      PORT: 3003
      OUTBOX_TABLA: stores.outbox

  orders-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-orders-service:prod
    pull_policy: always
    environment:
      SERVICIO: orders-service
      PORT: 3004
      OUTBOX_TABLA: orders.outbox

  logistics-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-logistics-service:prod
    pull_policy: always
    environment:
      SERVICIO: logistics-service
      PORT: 3005
      OUTBOX_TABLA: logistics.outbox

  finance-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-finance-service:prod
    pull_policy: always
    environment:
      SERVICIO: finance-service
      PORT: 3007
      OUTBOX_TABLA: finance.outbox
      COMMISSION_RATE: 0.12

  field-service:
    <<: *servicio-base
    image: ghcr.io/xozan845-ctrl/core-engine-field-service:prod
    pull_policy: always
    environment:
      SERVICIO: field-service
      PORT: 3008
      OUTBOX_TABLA: field.outbox

volumes:
  pg_data:
  rabbitmq_data:

networks:
  core-engine:
    name: core-engine
