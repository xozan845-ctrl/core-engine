# Core Engine · DESARROLLO (construye las imágenes en local)
# Entorno completo y autocontenido: Postgres + RabbitMQ + MinIO + gateway + los
# 15 microservicios (incluye `scheduling-service`, `commissions-service`, `analytics-service` y
# `market-intelligence-service`; solo `commissions-service` queda fuera de producción).
# Publica al host los puertos de datos y
# broker SOLO para desarrollo (conectar un cliente de BD o abrir la UI de
# RabbitMQ en localhost).
#
# Variables: copiar `.env.example` → `.env` (sin commitear, R-CD-7).
# Arranque:  docker compose -f docker-compose.dev.yml up -d --build
#
# Observabilidad opcional:
#   docker compose -f docker-compose.dev.yml -f docker-compose.observability.yml up -d --build
#
# Producción/pre-producción usan `docker-compose.yml` / `docker-compose.stage.yml`
# (imágenes de GHCR, sin `build:`); este archivo nunca se despliega.

x-servicio-base: &servicio-base
  # Cada servicio declara su propio `build.dockerfile` (crate Rust); el
  # contexto siempre es la raíz del repositorio.
  env_file:
    - .env
  environment:
    TZ: America/Managua
  depends_on:
    db-migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - core-engine
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$PORT/health >/dev/null || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  # ── Datos y BaaS (AD-08: Supabase-compatible, SQL estandar en Docker) ──
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_engine}
      POSTGRES_USER: ${POSTGRES_USER:-core_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida en .env}
      CORE_ENGINE_APP_PASSWORD: ${CORE_ENGINE_APP_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://core_engine_app:core_engine_dev@postgres:5432/core_engine}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Solo el esquema estandar entra en Docker local; 99_rls.sql (Supabase)
      # vive en infra/db/supabase/ y se aplica manualmente en staging/prod.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-core_engine} -d ${POSTGRES_DB:-core_engine}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Migraciones versionadas con ledger (R-DB-6) ───────────────────────
  db-migrate:
    image: postgis/postgis:16-3.4-alpine
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-core_engine}
      PGUSER: ${POSTGRES_USER:-core_engine}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      MIGRATIONS_DIR: /migrations
      APPLY_RLS: "false"
    volumes:
      - ./infra/db:/migrations:ro
    command: ["sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core-engine
    restart: "no"

  # ── Backup lógico diario (ADR-0044) ────────────────────────────────────
  # Dump custom con retención local. El envío fuera del host se hace desde
  # `backup.yml` o el almacenamiento externo que configure operación.
  db-backup:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-core_engine}
      PGUSER: ${POSTGRES_USER:-core_engine}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      # El dump necesita un rol con BYPASSRLS (owner); DATABASE_URL del .env
      # apunta a core_engine_app y pg_dump fallaria en tablas con RLS.
      DATABASE_URL: ${POSTGRES_URL:-}
      BACKUP_DIR: /backups
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-14}
      BACKUP_INTERVALO_SEGUNDOS: ${BACKUP_INTERVALO_SEGUNDOS:-86400}
    volumes:
      - ./infra/db/backup.sh:/usr/local/bin/backup.sh:ro
      - ./infra/db/restore-verify.sh:/usr/local/bin/restore-verify.sh:ro
      - db_backups:/backups
    command:
      - sh
      - -c
      - while true; do sh /usr/local/bin/backup.sh || true; sleep "$$BACKUP_INTERVALO_SEGUNDOS"; done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core-engine
    restart: unless-stopped

  # ── Broker de mensajeria (AD-02: RabbitMQ con DLQ) ─────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # (barrido A07/A08): guest deshabilitado en loopback. La credencial viene del
    # entorno (RABBITMQ_USER/RABBITMQ_PASSWORD), nunca de un fichero commiteado (R-CD-7).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-core-engine}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD requerida}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - core-engine

  # ── Almacenamiento de objetos (ADR-24: un bucket por tenant) ───────────
  minio:
    # Espejo del MinIO oficial: `minio/minio` no esta disponible en este entorno.
    # Fijado por DIGEST (= RELEASE.2025-09-07T16-13-09Z) para que sea inmutable.
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    command: server /data --console-address ":9001"
    environment:
      # Sin MINIO_* propias la credencial se deriva del secreto de RabbitMQ
      # del entorno (fuerte y ya presente): asi un deploy no falla entero por
      # faltar la variable. Pega MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
      # dedicadas cuando puedas: tienen prioridad (R-CD-7).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-core-engine-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${RABBITMQ_PASSWORD}}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - core-engine

  # ── API Gateway (punto de entrada unico) ───────────────────────────────
  gateway:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/api-gateway/Dockerfile
    environment:
      SERVICIO: api-gateway
      PORT: 8080
      # En desarrollo el diagnostico (/docs, /metrics) va abierto; en stage/prod
      # el borde lo cierra (DIAGNOSTICOS_PUBLICOS=false por defecto).
      DIAGNOSTICOS_PUBLICOS: "true"
      # El smoke local/CI usa /ready sin una clave de borde; stage/prod lo
      # mantiene privado y exige x-internal-key.
      READY_PUBLIC: "true"
    ports:
      - "8080:8080"
    networks:
      - core-engine

  # ── Microservicios por dominio (Tabla 7) ───────────────────────────────
  identity-service:
    <<: *servicio-base
    # ADR-0017: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/identity-service/Dockerfile
    environment:
      SERVICIO: identity-service
      PORT: 3001
      OUTBOX_TABLA: identity.outbox
      # Correo transaccional (ADR-0003): en dev `log`; el E2E usa Mailpit.
      EMAIL_MODE: ${EMAIL_MODE:-log}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@core-engine.test}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  item-service:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/item-service/Dockerfile
    environment:
      SERVICIO: item-service
      PORT: 3015
      OUTBOX_TABLA: item.outbox

  inventory-service:
    <<: *servicio-base
    # ADR-0018: inventario en su propio servicio.
    build:
      context: .
      dockerfile: packages/inventory-service/Dockerfile
    environment:
      SERVICIO: inventory-service
      PORT: 3013
      OUTBOX_TABLA: inventory.outbox

  pricing-service:
    <<: *servicio-base
    # ADR-0018: precios en su propio servicio.
    build:
      context: .
      dockerfile: packages/pricing-service/Dockerfile
    environment:
      SERVICIO: pricing-service
      PORT: 3014
      OUTBOX_TABLA: pricing.outbox

  stores-service:
    <<: *servicio-base
    # ADR-0011: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/stores-service/Dockerfile
    environment:
      SERVICIO: stores-service
      PORT: 3003
      OUTBOX_TABLA: stores.outbox

  orders-service:
    <<: *servicio-base
    # ADR-0013: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/orders-service/Dockerfile
    environment:
      SERVICIO: orders-service
      PORT: 3004
      OUTBOX_TABLA: orders.outbox

  scheduling-service:
    <<: *servicio-base
    # ADR-0004: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/scheduling-service/Dockerfile
    environment:
      SERVICIO: scheduling-service
      PORT: 3011
      OUTBOX_TABLA: scheduling.outbox

  logistics-service:
    <<: *servicio-base
    # ADR-0010: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/logistics-service/Dockerfile
    environment:
      SERVICIO: logistics-service
      PORT: 3005
      OUTBOX_TABLA: logistics.outbox

  commissions-service:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/commissions-service/Dockerfile
    environment:
      SERVICIO: commissions-service
      PORT: 3006
      OUTBOX_TABLA: commissions.outbox

  finance-service:
    <<: *servicio-base
    # ADR-0014: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/finance-service/Dockerfile
    environment:
      SERVICIO: finance-service
      PORT: 3007
      OUTBOX_TABLA: finance.outbox
      COMMISSION_RATE: 0.12

  field-service:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/field-service/Dockerfile
    environment:
      SERVICIO: field-service
      PORT: 3008
      OUTBOX_TABLA: field.outbox

  market-intelligence-service:
    <<: *servicio-base
    # ADR-0009: el servicio es Rust y tiene su propio Dockerfile multi-stage.
    build:
      context: .
      dockerfile: packages/market-intelligence-service/Dockerfile
    environment:
      SERVICIO: market-intelligence-service
      PORT: 3009
      OUTBOX_TABLA: intelligence.outbox

  analytics-service:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/analytics-service/Dockerfile
    environment:
      SERVICIO: analytics-service
      PORT: 3016

  storage-service:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/storage-service/Dockerfile
    environment:
      SERVICIO: storage-service
      PORT: 3010
      OUTBOX_TABLA: storage.outbox

  notifications-service:
    <<: *servicio-base
    build:
      context: .
      dockerfile: packages/notifications-service/Dockerfile
    environment:
      SERVICIO: notifications-service
      PORT: 3012
      # Mismo adapter que identity: el E2E conmuta a Mailpit.
      EMAIL_MODE: ${EMAIL_MODE:-log}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@core-engine.test}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  # Capturador SMTP solo para desarrollo: el E2E lee el enlace de reset desde
  # su API. No se publica fuera de loopback ni se despliega en stage/prod.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - core-engine
    restart: unless-stopped

volumes:
  pg_data:
  rabbitmq_data:
  minio_data:
  db_backups:

networks:
  core-engine:
    name: core-engine
