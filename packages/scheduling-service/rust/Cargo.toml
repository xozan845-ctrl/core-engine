[package]
name = "scheduling-service"
version = "1.0.9"
edition = "2021"
rust-version = "1.85"
description = "Agenda multi-vertical: recursos, disponibilidad, citas y recordatorios"
publish = false

[[bin]]
name = "scheduling-service"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
